<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle's Pokémon Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pkmn-green: #78c850;
            --pkmn-blue: #6890f0;
            --pkmn-bg: #f9fafb;
            /* Light Gray */
            --pkmn-border: #383838;
            --pkmn-window: #ffffff;
        }

        body {
            background-color: var(--pkmn-bg);
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        /* 像素背景层 */
        #pixel-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.5;
            /* Fade background slightly */
        }

        /* 经典的宝可梦对话框 */
        #dialog-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 120px;
            background: var(--pkmn-window);
            border: 6px solid var(--pkmn-border);
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
            display: flex;
            align-items: center;
            box-shadow: inset -4px -4px #e5e7eb, 0 8px 0 rgba(0, 0, 0, 0.1);
        }

        #dialog-text {
            font-size: 14px;
            line-height: 1.8;
            color: #374151;
            margin: 0;
        }

        /* 宝可梦状态卡片风格 */
        .pkmn-card {
            position: absolute;
            width: 240px;
            background: #fff;
            border: 4px solid var(--pkmn-border);
            border-radius: 0 0 20px 0;
            padding: 10px;
            cursor: grab;
            z-index: 10;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.1);
        }

        .pkmn-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 5px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 5px;
            color: #111827;
        }

        .hp-bar-container {
            width: 100%;
            height: 8px;
            background: #f3f4f6;
            border: 2px solid var(--pkmn-border);
            margin: 5px 0;
        }

        .hp-fill {
            width: 100%;
            height: 100%;
            background: var(--pkmn-green);
        }

        .photo-box {
            width: 100%;
            height: 150px;
            background: #f3f4f6;
            border: 2px solid var(--pkmn-border);
            overflow: hidden;
            margin-top: 5px;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        /* 交互提示词 */
        .cursor-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 8px;
            color: #111827;
        }
    </style>
</head>

<body>

    <canvas id="pixel-canvas"></canvas>

    <div class="cursor-hint">WILD PROJECTS APPEARED!</div>

    <div id="desk">
        <div class="pkmn-card" style="left: 10%; top: 15%;" onmouseover="say('野生的 Michelle 出现了！她使用了 UI 设计！')">
            <div class="pkmn-header"><span>Lvl 24</span><span>MICHELLE</span></div>
            <div class="hp-bar-container">
                <div class="hp-fill"></div>
            </div>
            <div class="photo-box"><img src="https://images.unsplash.com/photo-1594757303866-9b0d2d2a4c1e?w=400"></div>
        </div>

        <div class="pkmn-card" style="left: 45%; top: 30%;" onmouseover="say('发现了项目：TMS_Dashboard！看来是个强力的对手。')">
            <div class="pkmn-header"><span>Lvl 50</span><span>TMS_DASH</span></div>
            <div class="hp-bar-container">
                <div class="hp-fill" style="width: 80%; background: #f8d030;"></div>
            </div>
            <div class="photo-box"><img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=400"></div>
        </div>

        <div class="pkmn-card" style="left: 70%; top: 10%;" onmouseover="say('Unimo_AI 正在观察你。它看起来充满了智慧。')">
            <div class="pkmn-header"><span>Lvl 99</span><span>UNIMO_AI</span></div>
            <div class="hp-bar-container">
                <div class="hp-fill" style="width: 100%;"></div>
            </div>
            <div class="photo-box"><img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=400"></div>
        </div>
    </div>

    <div id="dialog-box">
        <p id="dialog-text">欢迎来到 Michelle 的宝可梦世界！拖拽卡片开始探索...</p>
    </div>

    <script>
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        const dialogText = document.getElementById('dialog-text');
        let particles = [];
        const mouse = { x: -100, y: -100 };

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- 像素粒子：草丛中的叶子 ---
        class Leaf {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 6 + 4;
                this.speed = Math.random() * 2 + 1;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.angle) * 0.5;
                this.angle += 0.05;

                // 鼠标拨开逻辑
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    this.x -= (dx / dist) * 5;
                    this.y -= (dy / dist) * 5;
                }

                if (this.y < -20) this.reset();
            }
            draw() {
                ctx.fillStyle = '#4dad5b'; // 经典的宝可梦绿
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Leaf());

        function animate() {
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // --- 对话框打字机效果 ---
        function say(content) {
            dialogText.innerText = content;
        }

        // --- 拖拽逻辑 ---
        const cards = document.querySelectorAll('.pkmn-card');
        let activeCard = null;
        let offsetX, offsetY;

        cards.forEach(card => {
            card.addEventListener('mousedown', e => {
                activeCard = card;
                const rect = card.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                card.style.zIndex = 1000;
            });
        });

        document.addEventListener('mousemove', e => {
            if (!activeCard) return;
            activeCard.style.left = (e.clientX - offsetX) + 'px';
            activeCard.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (activeCard) activeCard.style.zIndex = 10;
            activeCard = null;
        });

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>

    <!-- Global Glass Navigation -->
    <header class="nav-shell"
        style="position: fixed; top: 20px; width: 100%; z-index: 2000; display: flex; justify-content: center; pointer-events: none;">
        <nav class="nav-inner"
            style="pointer-events: auto; background: rgba(14, 14, 18, 0.8); backdrop-filter: blur(12px); border-radius: 100px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1);">
            <a href="index.html" class="nav-logo-link"
                style="padding: 0 8px; display: flex; align-items: center; border-radius: 999px; background: transparent !important;">
                <img src="image/logo.png" alt="Michelle.Design Logo"
                    style="height: 16px; opacity: 0.8; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'"
                    onmouseout="this.style.opacity='0.8'">
            </a>
            <a href="index.html"
                style="color: #ccc; text-decoration: none; padding: 8px 16px; font-family: 'Inter', sans-serif; font-size: 14px;">Home</a>
            <a href="about-me.html"
                style="color: #ccc; text-decoration: none; padding: 8px 16px; font-family: 'Inter', sans-serif; font-size: 14px;">About
                Me</a>
        </nav>
    </header>
</body>

</html>
