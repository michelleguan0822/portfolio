<!DOCTYPE html>
<html>
<head>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>
    <style>
        body { margin: 0; background: black; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; gap: 4px; }
        .box { position: relative; }
        .box::after { content: attr(data-label); position: absolute; top: 10px; left: 10px; color: red; font-weight: bold; }
        spline-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="box" data-label="Normal"><spline-viewer url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer></div>
        <div class="box" data-label="Invert"><spline-viewer style="filter: invert(1) hue-rotate(180deg);" url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer></div>
        <div class="box" data-label="Darken"><spline-viewer style="mix-blend-mode: difference;" url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer></div>
        <div class="box" data-label="Multiply"><spline-viewer style="mix-blend-mode: multiply; filter: brightness(0.5);" url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer></div>
    </div>
</body>
</html>
