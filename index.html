<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle's Portfolio</title>

    <!-- Tailwind CSS for rapid styling matching the Next.js prototype -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Spline Web Component -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap"
        rel="stylesheet">

    <!-- Base Custom Styles for Nav and Cursor -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cursor-styles.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background-color: black;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Nav adjustment for play page so it fits cleanly over black */
        .nav-shell {
            z-index: 50;
        }

        spline-viewer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Hide Spline Watermark */
        spline-viewer::part(logo) {
            display: none !important;
        }

        /* Prevent global styles.css white gradient overlay from hiding the Spline scene */
        body::before {
            display: none !important;
        }

        /* Glassmorphism custom tailwind overrides to match the prototype exact values if needed */
        .glass-card {
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px) scale(1.05);
        }

        /* Morph Loading Keyframes */
        @keyframes morph-0 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                border-radius: 0%;
            }

            25% {
                transform: translate(20px, -20px) scale(1.2);
                border-radius: 50%;
            }

            50% {
                transform: translate(40px, 0) scale(0.8);
                border-radius: 25%;
            }

            75% {
                transform: translate(20px, 20px) scale(1.1);
                border-radius: 75%;
            }
        }

        @keyframes morph-1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                border-radius: 0%;
            }

            25% {
                transform: translate(-20px, -20px) scale(1.3) rotate(90deg);
                border-radius: 50%;
            }

            50% {
                transform: translate(-40px, 0) scale(0.7) rotate(180deg);
                border-radius: 25%;
            }

            75% {
                transform: translate(-20px, 20px) scale(1.2) rotate(270deg);
                border-radius: 75%;
            }
        }

        @keyframes morph-2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                border-radius: 0%;
            }

            25% {
                transform: translate(-20px, 20px) scale(0.9);
                border-radius: 100%;
            }

            50% {
                transform: translate(0, 40px) scale(1.4);
                border-radius: 0%;
            }

            75% {
                transform: translate(20px, 20px) scale(0.8);
                border-radius: 50%;
            }
        }

        @keyframes morph-3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                border-radius: 0%;
            }

            25% {
                transform: translate(20px, 20px) scale(1.1) rotate(-90deg);
                border-radius: 25%;
            }

            50% {
                transform: translate(0, -40px) scale(1.3) rotate(-180deg);
                border-radius: 100%;
            }

            75% {
                transform: translate(-20px, -20px) scale(0.9) rotate(-270deg);
                border-radius: 75%;
            }
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>

<body class="relative w-screen text-white font-sans bg-black">

    <!-- Morph Loading Screen -->
    <div id="loading-page" class="loading-screen">
        <div class="relative w-24 h-24">
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="absolute w-4 h-4 bg-white"
                    style="animation: morph-0 2s infinite ease-in-out; animation-delay: 0s;"></div>
                <div class="absolute w-4 h-4 bg-white"
                    style="animation: morph-1 2s infinite ease-in-out; animation-delay: 0.2s;"></div>
                <div class="absolute w-4 h-4 bg-white"
                    style="animation: morph-2 2s infinite ease-in-out; animation-delay: 0.4s;"></div>
                <div class="absolute w-4 h-4 bg-white"
                    style="animation: morph-3 2s infinite ease-in-out; animation-delay: 0.6s;"></div>
            </div>
        </div>
    </div>

    <!-- Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>
    <script src="js/navbar.js"></script>
    <script>initNavbar('dark');</script>

    <!-- HERO SECTION -->
    <section id="hero-section" class="relative h-screen w-full overflow-hidden">
        <!-- Background Spline Scene -->
        <div id="spline-wrapper"
            class="absolute inset-0 h-screen z-0 pointer-events-auto bg-black transition-opacity duration-700">
            <spline-viewer loading="lazy"
                url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer>
        </div>

        <!-- Top-Left Title -->
        <div id="hero-intro"
            class="absolute top-32 left-8 md:left-14 z-10 flex flex-col items-start justify-start pointer-events-none max-w-2xl transition-all duration-700">
            <style>
                html {

                    scroll-snap-type: y proximity;
                    /* Proximity is gentler than mandatory for this layout */

                .snap-section {

                        z-index: 0 !important;
                    }

                    #hero-intro {

                        top: 0 !important;
                        left: 0 !important;

                .hero-spline {

                    inset: 0;
                    z-index: 10;
                }

                }

                }

                    font-family: 'Plus Jakarta Sans', sans-serif;
                    font-size: 13px;
                    font-weight: 500;

                }

                .hero-tag-dark:hover {
                    background: rgba(255, 255, 255, 0.1);
                    color: #ffffff;
                }
            </style>
            <h1 class="hero-title-dark">
                <span>M</span><span>I</span><span>C</span><span>H</span><span>E</span><span>L</span><span>L</span><span>E</span><span>.</span><span>D</span><span>E</span><span>S</span><span>I</span><span>G</span><span>N</span>
            </h1>
            <div class="hero-tags-dark">
                <span class="hero-tag-dark">AI/Healthcare</span>
                <span class="hero-tag-dark">Global Design Experience</span>
            </div>
            <div class="hero-tags-dark !mt-0">
                <span class="hero-tag-dark">4x App Store Launches</span>
            </div>
            <p class="text-[18px] text-white/70 max-w-[450px] text-left font-['Plus Jakarta Sans'] pointer-events-auto">
                Partnering with bold teams to design fast, ship smart.
            </p>

        </div>

        <!-- SCATTERED 3D CARDS (React Island) -->
        <div id="scattered-cards-hero" class="absolute inset-0 pointer-events-none overflow-visible z-20"></div>
        <script type="module">
            import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18';
            import { createRoot } from 'https://esm.sh/react-dom@18/client';
            import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@10';

            const cardData = [
                {
                    left: '39%', top: '65%', zIndex: 32, rotate: -2, scale: 1.4, color: '#55FFFF',
                    title: 'UNIMO', subtitle: 'AI Companion & Emotional Expression', year: '2024',
                    desc: 'Bridging the gap between human emotions and machine interfaces with advanced sentiment analysis and behavioral tracking.',
                    tags: ['AI', 'DESIGN', 'EMOTION'],
                    image: 'image/Unimo/hero.jpg',
                    url: 'unimo.html'
                },
                {
                    left: '14%', top: '64%', zIndex: 35, rotate: 8, scale: 1.2, color: '#00A2E8',
                    title: 'TMS Dashboard', subtitle: 'Clinical System & Data Visualization', year: '2023',
                    desc: 'A specialized dashboard for transportation management, optimizing logistics through data visualization and real-time tracking.',
                    tags: ['LOGISTICS', 'DASHBOARD', 'REAL-TIME'],
                    image: 'image/TMS/hero.png',
                    url: 'TMS.html'
                },
                {
                    left: '72%', top: '80%', zIndex: 30, rotate: 24, scale: 1.5, color: '#FF7F27',
                    title: 'Oltiva Insights', subtitle: 'ENTERPRISE AI WORKFLOW & DOCS', year: '2024',
                    desc: 'A comprehensive enterprise AI solution focusing on streamlining workflows and intelligently organizing documentation.',
                    tags: ['INSIGHTS', 'WORKFLOW', 'AI DOCS'],
                    image: 'image/avanade/hero_mockup.png',
                    aspect: 'aspect-[16/9]',
                    url: 'oltiva.html'
                },
            ];

            const random = (min, max) => Math.random() * (max - min) + min;

            function ScatteredCards() {
                const [hoveredIndex, setHoveredIndex] = useState(null);
                const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

                useEffect(() => {
                    const handleResize = () => setIsMobile(window.innerWidth <= 768);
                    window.addEventListener('resize', handleResize);
                    return () => window.removeEventListener('resize', handleResize);
                }, []);

                if (isMobile) {
                    const mobileOrder = [...cardData].reverse(); // UNIMO, TMS, Oltiva
                    return React.createElement('div', {
                        className: "flex flex-col gap-16 w-full max-w-[400px] mx-auto pb-20 px-4"
                    },
                        mobileOrder.map((card, index) => React.createElement('div', {
                            key: index,
                            className: "flex flex-col gap-6"
                        },
                            // Image Card
                            React.createElement('div', {
                                onClick: () => window.open(card.url, '_blank'),
                                className: `w-full ${card.aspect || 'aspect-[4/3]'} rounded-[2.5rem] bg-white/10 backdrop-blur-md border border-white/30 shadow-[0_20px_50px_rgba(0,0,0,0.5)] p-2 overflow-hidden cursor-pointer`
                            },
                                React.createElement('div', {
                                    className: "w-full h-full rounded-[2.2rem] overflow-hidden bg-zinc-900 border border-white/10 relative"
                                },
                                    React.createElement('img', {
                                        src: card.image,
                                        alt: card.title,
                                        className: "w-full h-full object-cover"
                                    })
                                )
                            ),
                            // Text Block (Matching Screenshot)
                            React.createElement('div', {
                                className: "px-4"
                            },
                                React.createElement('div', {
                                    className: "flex items-center gap-3 mb-1 cursor-pointer",
                                    onClick: () => {
                                        const originalIndex = cardData.findIndex(c => c.title === card.title);
                                        window.openProjectPopup && window.openProjectPopup(originalIndex);
                                    }
                                },
                                    React.createElement('h3', { className: "text-[28px] font-bold text-white tracking-tight" }, card.title),
                                    React.createElement('span', { className: "text-white text-2xl" }, " →")
                                ),
                                React.createElement('p', { className: "text-[16px] text-white/50 font-medium" }, card.subtitle)
                            )
                        ))
                    );
                }

                return React.createElement('div', {
                    className: "relative w-full h-full max-w-[1400px] mx-auto overflow-visible",
                    style: { transformStyle: 'preserve-3d', perspective: '1200px' }
                },
                    // The Detail Card (Floats in from right)
                    React.createElement(AnimatePresence, {},
                        hoveredIndex !== null && React.createElement(motion.div, {
                            key: "detail-card",
                            initial: { x: 50, opacity: 0, scale: 0.9 },
                            animate: { x: 0, opacity: 1, scale: 1 },
                            exit: { x: 30, opacity: 0, scale: 0.9 },
                            transition: { type: 'spring', stiffness: 200, damping: 25 },
                            className: "absolute top-[20%] right-[3%] md:right-[5%] w-[80%] max-w-[280px] z-[100] p-6 rounded-[1.8rem] bg-[#0c0c0c]/85 backdrop-blur-2xl border border-white/10 shadow-[0_20px_60px_rgba(0,0,0,0.8)] pointer-events-auto",
                            style: { transformStyle: 'preserve-3d' }
                        },
                            // Year Badge
                            React.createElement('div', { className: "absolute top-6 right-6 px-2.5 py-0.5 rounded-full border border-white/20 bg-white/5 text-[10px] font-mono text-white/50" }, cardData[hoveredIndex].year),

                            // Subtitle & Status
                            React.createElement('div', { className: "flex items-center gap-2 mb-3" },
                                React.createElement('div', { className: "w-2 h-2 rounded-full", style: { backgroundColor: cardData[hoveredIndex].color, boxShadow: `0 0 10px ${cardData[hoveredIndex].color}` } }),
                                React.createElement('span', { className: "text-[9px] font-mono text-white/40 uppercase tracking-[0.15em]" }, cardData[hoveredIndex].subtitle)
                            ),

                            // Title
                            React.createElement('h3', { className: "text-2xl font-bold text-white mb-4 tracking-tight leading-tight" }, cardData[hoveredIndex].title),

                            // Description
                            React.createElement('p', { className: "text-[13px] text-white/50 leading-relaxed mb-6 font-['Plus Jakarta Sans']" }, cardData[hoveredIndex].desc),

                            // Skill Tags
                            React.createElement('div', { className: "flex flex-wrap gap-2" },
                                cardData[hoveredIndex].tags.map(tag =>
                                    React.createElement('div', {
                                        key: tag,
                                        className: "px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-[8px] font-bold text-white/60 tracking-widest uppercase"
                                    }, tag)
                                )
                            )
                        )
                    ),

                    // The 3D Cards
                    cardData.map((card, index) => {
                        const initialY = 1000 + random(0, 400);
                        const initialRotate = card.rotate + random(-20, 20);
                        const floatOffset = random(5, 10);
                        const floatDuration = 3 + random(0, 2);
                        const hoverRotateVariation = random(-5, 5);

                        return React.createElement(motion.div, {
                            key: index,
                            initial: { opacity: 0, y: initialY, rotate: initialRotate, scale: card.scale },
                            animate: { opacity: 1, y: 0, rotate: card.rotate, scale: card.scale },
                            transition: { type: 'spring', stiffness: 45, damping: 16, mass: 1.1, delay: index * 0.15 },
                            onMouseEnter: () => setHoveredIndex(index),
                            onMouseLeave: () => setHoveredIndex(null),
                            onClick: () => window.open(card.url, '_blank'),
                            className: `absolute w-[220px] md:w-[280px] ${card.aspect || 'aspect-square'} pointer-events-auto cursor-pointer`,
                            style: {
                                left: card.left,
                                top: card.top,
                                zIndex: card.zIndex,
                                transformStyle: 'preserve-3d',
                                transform: `translateZ(-50px) translateX(-50%) translateY(-50%)`,
                            }
                        },
                            React.createElement(motion.div, {
                                animate: { y: [0, -floatOffset, 0] },
                                transition: { duration: floatDuration, repeat: Infinity, repeatType: 'mirror', ease: 'easeInOut' },
                                className: "w-full h-full overflow-visible",
                                style: { transformStyle: 'preserve-3d' }
                            },
                                React.createElement(motion.div, {
                                    whileHover: { scale: 1.1, y: -60, rotate: card.rotate + hoverRotateVariation },
                                    transition: { type: 'spring', stiffness: 300, damping: 20 },
                                    className: "w-full h-full p-3 rounded-[2.5rem] bg-white/10 backdrop-blur-md border border-white/30 shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex items-center justify-center overflow-visible",
                                    style: { transformStyle: 'preserve-3d' }
                                },
                                    React.createElement('div', {
                                        className: "w-full h-full rounded-[2rem] overflow-hidden bg-zinc-900 border border-white/10 relative"
                                    },
                                        React.createElement('div', {
                                            className: "w-full h-full relative overflow-hidden rounded-[2rem]"
                                        },
                                            React.createElement('img', {
                                                src: card.image,
                                                alt: card.title,
                                                className: "w-full h-full object-cover"
                                            })
                                        ),
                                        React.createElement('div', { className: "absolute top-[-100%] left-[-100%] w-[300%] h-[300%] bg-gradient-to-br from-white/20 via-transparent to-transparent rotate-[35deg] pointer-events-none opacity-30" })
                                    ))))
                    })
                );
            }

            const root = createRoot(document.getElementById('scattered-cards-hero'));
            root.render(React.createElement(ScatteredCards));
        </script>
    </section>




    <!-- Footer Section -->
    <footer class="relative z-40 bg-black pt-32 pb-16 flex flex-col items-center justify-center">
        <div class="flex flex-col items-center gap-6 pt-12 border-t border-white/10 w-full max-w-[800px] px-6">
            <img src="image/logo.png" alt="Michelle.Design Logo"
                class="h-8 opacity-60 grayscale hover:opacity-100 transition-opacity duration-300 cursor-pointer text-white mix-blend-screen"
                onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">
            <div class="flex gap-8">
                <a href="mailto:michelleguan321@gmail.com"
                    class="font-['Plus Jakarta Sans'] text-sm font-medium text-white/50 hover:text-white transition-colors duration-200">Email</a>
                <a href="https://www.linkedin.com/in/michelleguanux/" target="_blank"

    <!-- Initialize Lucide icons -->
    <script>
        lucide.createIcons();
    </script>
    <script>
        // Optimization: Intersection Observer to pause/hide Spline when not in view
        const splineWrapper = document.getElementById('spline-wrapper');
        const splineViewer = document.querySelector('spline-viewer');

        if (splineWrapper && splineViewer) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // In view: Show and ensure it's rendering
                        splineWrapper.style.opacity = '1';
                        splineWrapper.style.pointerEvents = 'auto';
                    } else {
                        // Not in view: Hide to save GPU resources
                        splineWrapper.style.opacity = '0';
                        splineWrapper.style.pointerEvents = 'none';
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(document.getElementById('hero-section'));
        }

        // Optimized Spline Watermark Removal
        let watermarkChecks = 0;
        const hideSplineLogo = setInterval(() => {
            const viewer = document.querySelector('spline-viewer');
            watermarkChecks++;
            if (viewer && viewer.shadowRoot) {
                const logo = viewer.shadowRoot.querySelector('#logo');
                if (logo) {
                    logo.remove();
                    clearInterval(hideSplineLogo);
                }
            }
            if (watermarkChecks > 100) clearInterval(hideSplineLogo); // Max 10s
        }, 100);
    </script>
    <script>
        // Handle Loading Screen Dismissal
        window.addEventListener('load', () => {
            const loadingPage = document.getElementById('loading-page');
            if (loadingPage) {
                setTimeout(() => {
                    loadingPage.classList.add('hidden');
                }, 1500); 
            }
        });
    </script>
    <script src="js/cursor.js"></script>
</body>
