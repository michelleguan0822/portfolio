<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<style>
    body { background: #000; color: #fff; padding: 100px; display: flex; flex-direction: column; gap: 100px;}
    
    .hero-title {
        display: flex;
        justify-content: center;
        margin: 0 0 16px 0;
        cursor: default;
    }

    .hero-title span {
        font-family: 'Roboto Flex', sans-serif;
        font-size: 86px;
        font-variation-settings: "wdth" 25, "wght" 100;
        letter-spacing: normal;
        line-height: 0.95;
        color: #fff;
        transition: font-variation-settings 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
    }

    .hero-title span:hover {
        font-variation-settings: "wdth" 120, "wght" 800;
        color: #7D9CB8;
    }

    .hero-title span:hover + span,
    .hero-title span:has(+ span:hover) {
        font-variation-settings: "wdth" 70, "wght" 400;
        color: #5A7E9D;
    }
</style>
</head>
<body>
    <div class="hero-title">
        <span>M</span><span>I</span><span>C</span><span>H</span><span>E</span><span>L</span><span>L</span><span>E</span><span>.</span><span>D</span><span>E</span><span>S</span><span>I</span><span>G</span><span>N</span>
    </div>
</body>
</html>
